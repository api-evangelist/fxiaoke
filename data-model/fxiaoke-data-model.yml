relationships: []
relationships_note: >-
  Deliberately empty. Deriving an entity-relationship graph requires either $ref links
  in an OpenAPI document or a published object reference listing each object's lookup
  fields; Fxiaoke publishes neither. The only relationship evidence on the public surface
  is the master/detail pattern above and <entity>_id field naming in worked examples.
  Inventing has_one/has_many edges from domain names would be fabrication.

gaps:
- No OpenAPI, JSON Schema or JSON Structure document for any object
- No published object catalog with apiNames — objects are discovered per tenant at runtime
- No field-type reference in machine-readable form
- No relationship/ERD documentation

