summary: >-
  Fxiaoke's data model is METADATA-DRIVEN, not statically published. The API exposes CRM
  business objects addressed by an apiName (AccountObj, ProductObj,
  erpSalesOrderObj, ...) and the authoritative field list for any object is retrieved at
  runtime from the object-describe endpoints — not from a schema document. This artifact
  therefore records the object DOMAINS the reference documents and the discovery
  mechanism, and deliberately does not enumerate fields or relationships that would have
  to be invented: no OpenAPI, JSON Schema or ERD is published.

discovery:
  mechanism: runtime object-describe
  endpoints:
  - name: 查询对象描述 (describe object)
    docs: https://developer.fxiaoke.com/openapi_v2/common/system/object-describe/describe.html
    returns: data.describe (business object description) -> data.describe.fields (field collection)
  - name: 对象列表 (list objects)
    docs: https://developer.fxiaoke.com/openapi_v2/common/system/object-describe/list.html
  field_shape:
    path: data -> describe -> fields -> <fieldApiName> -> type
    note: >-
      Each field carries a "type" and the value-formatting guide maps each type to the
      format a write must supply. Custom objects and custom fields created by a tenant
      appear through the same mechanism, so the effective schema is per-tenant.
    docs: https://developer.fxiaoke.com/openapi_v2/start/guide/param.html
  admin_alternative: Administrators can read the field list from the CRM admin console.

identifiers:
  primary_key: _id
  format: 32-character lowercase hex (observed in the deep-paging worked example)
  ordering: >-
    _id is sortable and is the documented keyset-pagination key — order by _id ascending
    and filter _id GT the last value seen.
  tenant: corpId, prefix FSCID_
  application: appId, prefix FSAID_
  user: openUserId / 员工ID
  object_reference: >-
    Objects are referenced by apiName strings (e.g. dataObjectApiName: "AccountObj").
    Foreign-key style fields follow a <entity>_id convention — observed in the published
    ERP payload example: product_id, order_account_id.

query_contract:
  request_object: search_query_info
  fields: [limit, offset, filters, orders, fieldProjection]
  filter_shape: '{operator, field_name, field_values[]}'
  operators_observed: [GT]
  order_shape: '{fieldName, isAsc}'
  total_opt_in: find_explicit_total_num
  source: https://developer.fxiaoke.com/openapi_v2/FAQ/deep-paging.html

master_detail:
  supported: true
  evidence: >-
    Sync payloads carry masterFieldVal (the master object) and detailFieldVals (a map of
    detail-object apiName -> array of detail rows), e.g. erpSalesOrderObj with
    erpSalesOrderProductObj children. This is the platform's has_many representation.
  source: https://developer.fxiaoke.com/openapi_v2/common/system/other/ERP/push.html

