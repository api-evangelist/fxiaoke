format: custom-errorcode
rfc9457: false
description: >-
  Fxiaoke Open API v2 does not use RFC 9457 problem+json. Every response is a JSON object
  carrying a numeric errorCode, a human-readable errorMessage, an optional
  errorDescription, and a per-request traceId. The complete registry is published as
  "全局返回码" (Global Return Codes) in the developer manual and is transcribed in full below.

envelope:
  fields:
  - name: errorCode
    type: integer
    description: Return code. 0 indicates success; any non-zero value indicates an error.
  - name: errorMessage
    type: string
    description: >-
      Human-readable result or error text. The docs explicitly warn against branching on
      this field — "不能使用返回值的message字段做逻辑判断，errorMessage会有变化" (errorMessage is
      subject to change). Branch on errorCode only.
    stable: false
  - name: errorDescription
    type: string
    required: false
    description: Longer description; carries "success" on a successful call.
  - name: traceId
    type: string
    description: Per-request trace identifier for support correlation.
  success_code: 0

http_semantics:
  status_codes_meaningful: false
  note: >-
    CRITICAL RUNTIME SEMANTIC. The gateway returns HTTP 200 for business and
    authorization failures alike — an expired token, a permission denial, an exhausted
    quota and a successful write are all HTTP 200. A client MUST parse errorCode from the
    body on every response; HTTP status carries no application meaning. Unrecognised
    paths also return 200 with errorCode 10006 rather than a 404.

