client_side_codes:
  note: >-
    The FS JS API returns the same {errorCode, errorMessage} shape to its onFail
    callback. Two codes appear only on that surface in the documentation.
  codes:
  - code: 30000
    title: 请更新纷享客户端到最新版本
    title_en: Client version too old — update the Fxiaoke client
    source: https://developer.fxiaoke.com/openapi_v2/common/client/guide/js.html
  - code: 40000
    title: 请求参数错误
    title_en: Request parameter error
    source: https://developer.fxiaoke.com/openapi_v2/common/client/guide/js.html

