name: Fxiaoke
description: 'Fxiaoke (纷享销客 / Fenxiang) is a Chinese enterprise SaaS company providing
  a connected, AI-driven "Agentic CRM" platform that spans marketing, sales, and customer
  service for 6,000+ enterprise customers across manufacturing, consumer goods, healthcare,
  and technology. Its Open API v2 platform (developer.fxiaoke.com) exposes CRM business
  objects (accounts, contacts, leads, opportunities, products, orders) and common
  services such as approval workflows, contact/directory sync, and business-data sync
  over a JSON/HTTP RPC interface hosted at open.fxiaoke.com. Authentication uses a
  self-built enterprise application (appId + appSecret + permanentCode) exchanged for
  a corp/app access token, alongside a modern OAuth 2.1 authorization server (PKCE,
  dynamic client registration) discoverable via RFC 8414 metadata. Backed by DCM Ventures
  and Qiming Venture Partners.'
