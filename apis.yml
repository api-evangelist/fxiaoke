    leads, opportunities, products, orders) and common services (approval workflows,
    directory/contact sync, business-data sync) as a JSON-over-HTTP POST RPC interface.
    Enterprise apps authenticate with appId + appSecret + permanentCode to obtain a
    company/app access token, then call object CRUD and query operations. Responses
    use an errorCode / errorMessage / traceId envelope.'
