notes: >-
  open.fxiaoke.com publishes a genuine RFC 8414 OAuth 2.0 Authorization Server
  Metadata document (issuer https://open.fxiaoke.com/oauth2.0) advertising a PKCE
  (S256) authorization_code + refresh_token flow and an RFC 7591 dynamic client
  registration endpoint. The same JSON is served at the issuer-scoped
  /oauth2.0/.well-known/openid-configuration path. jwks_uri returns an empty key
  set ({"keys":[]}) at probe time. www.fxiaoke.com returns HTTP 200 for arbitrary
  /.well-known/* and /llms.txt paths (soft-404 catch-all) and is therefore NOT
  treated as publishing these documents.
