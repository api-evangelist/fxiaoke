findings:
  oauth_metadata_is_regional: >-
    Every reachable regional cloud host serves its OWN RFC 8414 metadata document with a
    host-scoped issuer, authorization endpoint, token endpoint, JWKS and dynamic
    registration endpoint. This is a genuinely good multi-region discovery posture and
    the strongest machine-readable surface Fxiaoke publishes.
  jwks_empty: >-
    Every jwks_uri probed returns {"keys":[]}, so the RS256 id_token the metadata
    advertises cannot be verified by a client that follows discovery.
  no_security_txt: >-
    No RFC 9116 security.txt on any host. No SecurityTxt pointer is emitted.
  no_agent_card: >-
    No A2A agent card on any host. The only 200s came from the www SPA catch-all and are
    HTML, not AgentCard JSON. Nothing is written to a2a/ and no AgentCard pointer is
    emitted.

notes: >-
  A WellKnown pointer IS emitted, because at least one path on the provider's own hosts
  returns a real, parsing document — the RFC 8414 metadata, confirmed on five separate
  hosts. SecurityTxt, AgentCard and LLMsTxt (searched) pointers are NOT emitted, because
  every candidate for those either 404d or returned an HTML/SPA shell.
