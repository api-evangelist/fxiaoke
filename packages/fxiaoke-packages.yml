notes: >-
  The practical consequence for an integrator: there is no maintained, installable
  Fxiaoke client for any server-side language. Integrations are written by hand against
  the JSON-over-HTTP POST reference, which is consistent with the docs' own tooling
  page recommending Postman/Insomnia/Apifox rather than an SDK.
