  registries_checked: [npm, pypi, maven-central, github]
  note: >-
    Fxiaoke publishes no server-side SDK to any public package registry. The only
    first-party client library it distributes is the FS JS API browser bundle, served
    from its own CDN path on www.fxiaoke.com — there is no npm/PyPI/Maven artifact for
    it, so currency is read from the pinned version in the URL and the CDN
    Last-Modified header rather than a registry metadata endpoint.

